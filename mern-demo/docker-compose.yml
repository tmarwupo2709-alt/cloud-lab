
services:
  backend:
    build: ./server
    container_name: mern-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: ${MONGODB_URI}
    env_file:
      - ./server/.env

  frontend:
    image: chamcham27/mern-frontend:2.0
    container_name: mern-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
